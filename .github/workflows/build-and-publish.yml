name: Build & Publish to Google Play

on:
  push:
    tags:
      - 'v*.*.*'          # Запускается при пуше тега вида v1.0.0
  workflow_dispatch:       # Ручной запуск из GitHub Actions UI
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# ── Переменные окружения ─────────────────────────────────────────────────────
env:
  JAVA_VERSION: '21'
  ANDROID_API_LEVEL: '34'
  BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Тесты (запускается всегда)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Сборка и публикация AAB
  # ────────────────────────────────────────────────────────────────────────────
  build-and-publish:
    name: Build AAB & Publish
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1. Чекаут кода
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно для подсчёта коммитов (versionCode)

      # 2. JDK
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      # 3. Декодировать keystore из секрета Base64
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set or empty"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > point-release.jks
          echo "Keystore decoded: $(stat -c%s point-release.jks) bytes"

      # 4. Создать keystore.properties
      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          printf 'storeFile=../point-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          echo "keystore.properties created"

      # 5. Вычислить versionCode из количества коммитов
      - name: Compute versionCode
        id: version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          # Для тегов берём имя тега (v1.0.0 → 1.0.0), иначе 1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.0"
          fi
          echo "code=$VERSION_CODE"   >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME"   >> $GITHUB_OUTPUT
          echo "VersionCode=$VERSION_CODE, VersionName=$VERSION_NAME"

      # 6. Обновить versionCode/versionName в build.gradle
      - name: Update version in build.gradle
        run: |
          # Используем | как разделитель sed (VERSION_NAME может содержать /)
          sed -i "s|versionCode [0-9]*|versionCode ${{ steps.version.outputs.code }}|" app/build.gradle
          sed -i "s|versionName \"[^\"]*\"|versionName \"${{ steps.version.outputs.name }}\"|" app/build.gradle
      # 7. Собрать подписанный AAB
      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon

      # 8. Проверить подпись
      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs \
            app/build/outputs/bundle/release/app-release.aab

      # 9. Сохранить AAB как артефакт
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # 10. Определить track (тег → production, ручной запуск → выбранный трек)
      - name: Determine publish track
        id: track
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "track=${{ github.event.inputs.track }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v*.*.* ]]; then
            echo "track=production" >> $GITHUB_OUTPUT
          else
            echo "track=internal" >> $GITHUB_OUTPUT
          fi

      # 11. Опубликовать в Google Play
      - name: Publish to Google Play (${{ steps.track.outputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pointgame.classic
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.track.outputs.track }}
          status: completed
          releaseName: ${{ steps.version.outputs.name }}
          changesNotSentForReview: false
          whatsNewDirectory: store_assets/whatsnew/

      # 12. Создать GitHub Release при пуше тега
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          name: "Point ${{ steps.version.outputs.name }}"
