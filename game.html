  <script>
// ===== TYPES =====
// Type definitions for the game

// ===== EVENT BUS =====
class EventBus {
  constructor() {
    this.listeners = new Map();
  }
  on(event, handler) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, new Set());
    }
    this.listeners.get(event).add(handler);
  }
  off(event, handler) {
    this.listeners.get(event)?.delete(handler);
  }
  emit(event, ...args) {
    this.listeners.get(event)?.forEach(handler => handler(...args));
  }
  clear() {
    this.listeners.clear();
  }
}

// ===== BOARD =====
class Board {
  constructor(width, height) {
    this.width = width;
    this.height = height;
    this.grid = Array.from({ length: height }, () =>
      Array.from({ length: width }, () => null)
    );
  }
  isInBounds(point) {
    return point.x >= 0 && point.x < this.width && point.y >= 0 && point.y < this.height;
  }
  getDot(point) {
    if (!this.isInBounds(point)) return null;
    return this.grid[point.y][point.x];
  }
  isEmpty(point) {
    return this.isInBounds(point) && this.grid[point.y][point.x] === null;
  }
  placeDot(point, player, moveNumber) {
    if (!this.isInBounds(point)) throw new Error('Out of bounds');
    if (this.grid[point.y][point.x] !== null) throw new Error('Cell occupied');
    this.grid[point.y][point.x] = {
      point: { x: point.x, y: point.y },
      owner: player,
      captured: false,
      moveNumber,
    };
  }
  removeDot(point) {
    if (this.isInBounds(point)) {
      this.grid[point.y][point.x] = null;
    }
  }
  markCaptured(points, capturedBy) {
    for (const p of points) {
      const dot = this.grid[p.y]?.[p.x];
      if (dot) {
        dot.captured = true;
        dot.capturedBy = capturedBy;
      }
    }
  }
  unmarkCaptured(points) {
    for (const p of points) {
      const dot = this.grid[p.y]?.[p.x];
      if (dot) {
        dot.captured = false;
        dot.capturedBy = undefined;
      }
    }
  }
  getDotsForPlayer(player) {
    const dots = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) {
        const dot = this.grid[y][x];
        if (dot && dot.owner === player) dots.push(dot);
      }
    }
    return dots;
  }
  getAdjacentPoints(point) {
    const dirs = [
      { x: -1, y: -1 }, { x: 0, y: -1 }, { x: 1, y: -1 },
      { x: -1, y: 0 },                     { x: 1, y: 0 },
      { x: -1, y: 1 },  { x: 0, y: 1 },  { x: 1, y: 1 },
    ];
    return dirs
      .map(d => ({ x: point.x + d.x, y: point.y + d.y }))
      .filter(p => this.isInBounds(p));
  }
  getAllDots() {
    const dots = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) {
        const dot = this.grid[y][x];
        if (dot) dots.push(dot);
      }
    }
    return dots;
  }
  isFull() {
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) {
        if (this.grid[y][x] === null) return false;
      }
    }
    return true;
  }
  getEmptyPoints() {
    const points = [];
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) {
        if (this.grid[y][x] === null) points.push({ x, y });
      }
    }
    return points;
  }
  clone() {
    const board = new Board(this.width, this.height);
    for (let y = 0; y < this.height; y++) {
      for (let x = 0; x < this.width; x++) {
        const dot = this.grid[y][x];
        if (dot) {
          board.grid[y][x] = { ...dot, point: { ...dot.point } };
        }
      }
    }
    return board;
  }
}

// ===== CAPTURE DETECTOR =====
class CaptureDetector {
  detectCaptures(board, _lastMove, player) {
    return this.findEnclosedRegions(board, player);
  }
  findEnclosedRegions(board, wallPlayer) {
    const { width, height } = board;
    const visited = Array.from({ length: height }, () =>
      Array.from({ length: width }, () => false)
    );
    const isWall = (x, y) => {
      const dot = board.getDot({ x, y });
      return dot !== null && dot.owner === wallPlayer && !dot.captured;
    };
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (isWall(x, y)) {
          visited[y][x] = true;
        }
      }
    }
    const regions = [];
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        if (visited[y][x]) continue;
        const component = [];
        const opponentDots = [];
        let touchesEdge = false;
        const queue = [{ x, y }];
        visited[y][x] = true;
        while (queue.length > 0) {
          const current = queue.pop();
          component.push(current);
          const dot = board.getDot(current);
          if (dot && dot.owner !== wallPlayer && !dot.captured) {
            opponentDots.push(current);
          }
          if (current.x === 0 || current.x === width - 1 ||
              current.y === 0 || current.y === height - 1) {
            touchesEdge = true;
          }
          const neighbors = [
            { x: current.x - 1, y: current.y },
            { x: current.x + 1, y: current.y },
            { x: current.x, y: current.y - 1 },
            { x: current.x, y: current.y + 1 },
          ];
          for (const neighbor of neighbors) {
            if (neighbor.x >= 0 && neighbor.x < width &&
                neighbor.y >= 0 && neighbor.y < height &&
                !visited[neighbor.y][neighbor.x]) {
              visited[neighbor.y][neighbor.x] = true;
              queue.push(neighbor);
            }
          }
        }
        if (!touchesEdge && opponentDots.length > 0) {
          const boundary = this.findBoundary(board, component, wallPlayer);
          regions.push({
            boundary,
            interior: component,
            capturedDots: opponentDots,
            owner: wallPlayer,
          });
        }
      }
    }
    return regions;
  }
  findBoundary(board, interior, wallPlayer) {
    const boundarySet = new Set();
    const boundary = [];
    for (const point of interior) {
      const neighbors = board.getAdjacentPoints(point);
      for (const neighbor of neighbors) {
        const dot = board.getDot(neighbor);
        if (dot && dot.owner === wallPlayer && !dot.captured) {
          const key = `${neighbor.x},${neighbor.y}`;
          if (!boundarySet.has(key)) {
            boundarySet.add(key);
            boundary.push(neighbor);
          }
        }
      }
    }
    return boundary;
  }
}

// ===== GAME RULES =====
class GameRules {
  static isValidMove(board, point) {
    return board.isInBounds(point) && board.isEmpty(point);
  }
  static isGameOver(board, consecutivePasses) {
    return board.isFull() || consecutivePasses >= 2;
  }
  static getValidMoves(board) {
    return board.getEmptyPoints();
  }
  static calculateScore(board) {
    const score = { red: 0, blue: 0 };
    for (const dot of board.getAllDots()) {
      if (dot.captured) {
        if (dot.owner === 'red') score.blue++;
        else score.red++;
      }
    }
    return score;
  }
  static getWinner(board) {
    const score = GameRules.calculateScore(board);
    if (score.red > score.blue) return 'red';
    if (score.blue > score.red) return 'blue';
    return null;
  }
}

// ===== HISTORY =====
class History {
  constructor() {
    this.undoStack = [];
    this.redoStack = [];
  }
  push(record) {
    this.undoStack.push(record);
    this.redoStack = [];
  }
  undo() {
    const record = this.undoStack.pop();
    if (record) {
      this.redoStack.push(record);
    }
    return record || null;
  }
  redo() {
    const record = this.redoStack.pop();
    if (record) {
      this.undoStack.push(record);
    }
    return record || null;
  }
  canUndo() {
    return this.undoStack.length > 0;
  }
  canRedo() {
    return this.redoStack.length > 0;
  }
  getMoveList() {
    return this.undoStack.map(r => r.move);
  }
  clear() {
    this.undoStack = [];
    this.redoStack = [];
  }
}

// ===== GAME CONTROLLER =====
class GameController {
  constructor(config, eventBus) {
    this.config = config;
    this.eventBus = eventBus;
    this.board = new Board(config.boardWidth, config.boardHeight);
    this.history = new History();
    this.captureDetector = new CaptureDetector();
    this.phase = 'setup';
    this.currentPlayer = 'red';
    this.consecutivePasses = 0;
    this.moveCount = 0;
  }
  startGame() {
    this.phase = 'playing';
    this.eventBus.emit('game:started', this.config);
  }
  getPhase() { return this.phase; }
  getCurrentPlayer() { return this.currentPlayer; }
  getBoard() { return this.board; }
  getConfig() { return this.config; }
  getMoveHistory() { return this.history.getMoveList(); }
  canUndo() { return this.history.canUndo(); }
  canRedo() { return this.history.canRedo(); }
  getScore() {
    return GameRules.calculateScore(this.board);
  }
  makeMove(point) {
    if (this.phase !== 'playing') {
      return { success: false, error: 'Game is not in playing phase' };
    }
    if (!GameRules.isValidMove(this.board, point)) {
      return { success: false, error: 'Invalid move' };
    }
    this.moveCount++;
    this.consecutivePasses = 0;
    this.board.placeDot(point, this.currentPlayer, this.moveCount);
    const captures = this.captureDetector.detectCaptures(this.board, point, this.currentPlayer);
    const newlyCapturedDots = [];
    for (const region of captures) {
      for (const cp of region.capturedDots) {
        const dot = this.board.getDot(cp);
        if (dot && !dot.captured) {
          newlyCapturedDots.push({ point: cp, owner: dot.owner });
        }
      }
    }
    for (const region of captures) {
      const uncapturedDots = region.capturedDots.filter(cp => {
        const dot = this.board.getDot(cp);
        return dot && !dot.captured;
      });
      this.board.markCaptured(uncapturedDots, this.currentPlayer);
    }
    const move = {
      point,
      player: this.currentPlayer,
      moveNumber: this.moveCount,
      captures,
      timestamp: Date.now(),
    };
    const record = { move, capturedDotsBefore: newlyCapturedDots };
    this.history.push(record);
    this.eventBus.emit('move:made', move);
    if (captures.length > 0) {
      this.eventBus.emit('capture:detected', captures);
    }
    const gameOver = GameRules.isGameOver(this.board, this.consecutivePasses);
    if (gameOver) {
      this.phase = 'gameOver';
      const winner = GameRules.getWinner(this.board);
      this.eventBus.emit('game:over', winner, this.getScore());
      return { success: true, captures, gameOver: true, winner };
    }
    this.currentPlayer = this.currentPlayer === 'red' ? 'blue' : 'red';
    this.eventBus.emit('turn:changed', this.currentPlayer);
    return { success: true, captures, gameOver: false };
  }
  pass() {
    if (this.phase !== 'playing') return;
    this.consecutivePasses++;
    this.currentPlayer = this.currentPlayer === 'red' ? 'blue' : 'red';
    this.eventBus.emit('turn:changed', this.currentPlayer);
    if (GameRules.isGameOver(this.board, this.consecutivePasses)) {
      this.phase = 'gameOver';
      const winner = GameRules.getWinner(this.board);
      this.eventBus.emit('game:over', winner, this.getScore());
    }
  }
  undo() {
    if (this.phase === 'gameOver') {
      this.phase = 'playing';
    }
    const record = this.history.undo();
    if (!record) return false;
    for (const { point } of record.capturedDotsBefore) {
      this.board.unmarkCaptured([point]);
    }
    this.board.removeDot(record.move.point);
    this.moveCount--;
    this.currentPlayer = record.move.player;
    this.consecutivePasses = 0;
    this.eventBus.emit('undo:performed');
    this.eventBus.emit('turn:changed', this.currentPlayer);
    return true;
  }
  redo() {
    const record = this.history.redo();
    if (!record) return false;
    this.moveCount++;
    this.board.placeDot(record.move.point, record.move.player, this.moveCount);
    for (const { point } of record.capturedDotsBefore) {
      this.board.markCaptured([point], record.move.player);
    }
    this.currentPlayer = record.move.player === 'red' ? 'blue' : 'red';
    this.consecutivePasses = 0;
    if (GameRules.isGameOver(this.board, this.consecutivePasses)) {
      this.phase = 'gameOver';
      const winner = GameRules.getWinner(this.board);
      this.eventBus.emit('game:over', winner, this.getScore());
    }
    this.eventBus.emit('redo:performed');
    this.eventBus.emit('turn:changed', this.currentPlayer);
    return true;
  }
}

// ===== AI =====
class EasyAI {
  getDifficulty() { return 'easy'; }
  chooseMove(board, player) {
    const emptyPoints = board.getEmptyPoints();
    if (emptyPoints.length === 0) throw new Error('No moves');
    const detector = new CaptureDetector();
    const moveNumber = board.getAllDots().length + 1;
    const capturingMoves = [];
    for (const point of emptyPoints) {
      const simBoard = board.clone();
      simBoard.placeDot(point, player, moveNumber);
      if (detector.detectCaptures(simBoard, point, player).length > 0) {
        capturingMoves.push(point);
      }
    }
    if (capturingMoves.length > 0) {
      return capturingMoves[Math.floor(Math.random() * capturingMoves.length)];
    }
    if (Math.random() < 0.7) {
      const ownDots = board.getDotsForPlayer(player);
      if (ownDots.length > 0) {
        const ownDotSet = new Set(ownDots.map(d => `${d.point.x},${d.point.y}`));
        const adjacentMoves = emptyPoints.filter(point => {
          const adjacent = board.getAdjacentPoints(point);
          return adjacent.some(adj => ownDotSet.has(`${adj.x},${adj.y}`));
        });
        if (adjacentMoves.length > 0) {
          return adjacentMoves[Math.floor(Math.random() * adjacentMoves.length)];
        }
      }
    }
    return emptyPoints[Math.floor(Math.random() * emptyPoints.length)];
  }
}

// ===== BOARD RENDERER =====
const THEME = {
  boardBg: '#16213e',
  grid: '#2a3a5c',
  player1: '#ef4444',
  player2: '#3b82f6',
  text: '#e2e8f0',
  textSecondary: '#94a3b8',
  accent: '#f59e0b',
  accentGlow: 'rgba(245, 158, 11, 0.3)',
  captureAlpha: 0.18,
};

class BoardRenderer {
  constructor(canvas, boardWidth, boardHeight) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.boardWidth = boardWidth;
    this.boardHeight = boardHeight;
    this.resize();
  }
  resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.scale(dpr, dpr);
    const padding = 1;
    const gridW = this.boardWidth - 1;
    const gridH = this.boardHeight - 1;
    this.cellSize = Math.min(
      rect.width / (gridW + padding * 2),
      rect.height / (gridH + padding * 2)
    );
    this.offsetX = (rect.width - gridW * this.cellSize) / 2;
    this.offsetY = (rect.height - gridH * this.cellSize) / 2;
  }
  render(board, options = {}) {
    const rect = this.canvas.getBoundingClientRect();
    this.ctx.fillStyle = THEME.boardBg;
    this.ctx.fillRect(0, 0, rect.width, rect.height);
    this.drawGrid();
    this.drawDots(board);
    if (options.lastMove) {
      this.drawLastMoveHighlight(options.lastMove);
    }
    if (options.hoverPoint && options.hoverPlayer) {
      this.drawHoverDot(options.hoverPoint, options.hoverPlayer);
    }
  }
  drawGrid() {
    this.ctx.strokeStyle = THEME.grid;
    this.ctx.lineWidth = 0.5;
    for (let x = 0; x < this.boardWidth; x++) {
      const px = this.offsetX + x * this.cellSize;
      this.ctx.beginPath();
      this.ctx.moveTo(px, this.offsetY);
      this.ctx.lineTo(px, this.offsetY + (this.boardHeight - 1) * this.cellSize);
      this.ctx.stroke();
    }
    for (let y = 0; y < this.boardHeight; y++) {
      const py = this.offsetY + y * this.cellSize;
      this.ctx.beginPath();
      this.ctx.moveTo(this.offsetX, py);
      this.ctx.lineTo(this.offsetX + (this.boardWidth - 1) * this.cellSize, py);
      this.ctx.stroke();
    }
  }
  drawDots(board) {
    const dots = board.getAllDots();
    const radius = this.cellSize * 0.3;
    for (const dot of dots) {
      const px = this.offsetX + dot.point.x * this.cellSize;
      const py = this.offsetY + dot.point.y * this.cellSize;
      const color = dot.owner === 'red' ? THEME.player1 : THEME.player2;
      this.ctx.beginPath();
      this.ctx.arc(px, py, radius, 0, Math.PI * 2);
      if (dot.captured) {
        this.ctx.fillStyle = this.colorAlpha(color, 0.35);
        this.ctx.fill();
        this.ctx.strokeStyle = this.colorAlpha(color, 0.5);
        this.ctx.lineWidth = 1;
        this.ctx.stroke();
        const xr = radius * 0.6;
        this.ctx.strokeStyle = this.colorAlpha(dot.capturedBy || dot.owner === 'red' ? THEME.player1 : THEME.player2, 0.7);
        this.ctx.lineWidth = 1.5;
        this.ctx.beginPath();
        this.ctx.moveTo(px - xr, py - xr);
        this.ctx.lineTo(px + xr, py + xr);
        this.ctx.moveTo(px + xr, py - xr);
        this.ctx.lineTo(px - xr, py + xr);
        this.ctx.stroke();
      } else {
        const gradient = this.ctx.createRadialGradient(px - radius * 0.3, py - radius * 0.3, 0, px, py, radius);
        gradient.addColorStop(0, this.lighten(color, 30));
        gradient.addColorStop(1, color);
        this.ctx.fillStyle = gradient;
        this.ctx.fill();
        this.ctx.strokeStyle = this.darken(color, 20);
        this.ctx.lineWidth = 1;
        this.ctx.stroke();
      }
    }
  }
  drawLastMoveHighlight(point) {
    const px = this.offsetX + point.x * this.cellSize;
    const py = this.offsetY + point.y * this.cellSize;
    const radius = this.cellSize * 0.45;
    this.ctx.strokeStyle = THEME.accent;
    this.ctx.lineWidth = 2;
    this.ctx.beginPath();
    this.ctx.arc(px, py, radius, 0, Math.PI * 2);
    this.ctx.stroke();
    this.ctx.strokeStyle = THEME.accentGlow;
    this.ctx.lineWidth = 4;
    this.ctx.beginPath();
    this.ctx.arc(px, py, radius + 2, 0, Math.PI * 2);
    this.ctx.stroke();
  }
  drawHoverDot(point, player) {
    const px = this.offsetX + point.x * this.cellSize;
    const py = this.offsetY + point.y * this.cellSize;
    const radius = this.cellSize * 0.3;
    const color = player === 'red' ? THEME.player1 : THEME.player2;
    this.ctx.fillStyle = this.colorAlpha(color, 0.4);
    this.ctx.beginPath();
    this.ctx.arc(px, py, radius, 0, Math.PI * 2);
    this.ctx.fill();
  }
  canvasToGrid(canvasX, canvasY) {
    const gridX = Math.round((canvasX - this.offsetX) / this.cellSize);
    const gridY = Math.round((canvasY - this.offsetY) / this.cellSize);
    if (gridX < 0 || gridX >= this.boardWidth || gridY < 0 || gridY >= this.boardHeight) {
      return null;
    }
    const px = this.offsetX + gridX * this.cellSize;
    const py = this.offsetY + gridY * this.cellSize;
    const dist = Math.sqrt((canvasX - px) ** 2 + (canvasY - py) ** 2);
    if (dist > this.cellSize * 0.45) return null;
    return { x: gridX, y: gridY };
  }
  lighten(hex, amount) {
    const r = Math.min(255, parseInt(hex.slice(1, 3), 16) + amount);
    const g = Math.min(255, parseInt(hex.slice(3, 5), 16) + amount);
    const b = Math.min(255, parseInt(hex.slice(5, 7), 16) + amount);
    return `rgb(${r}, ${g}, ${b})`;
  }
  darken(hex, amount) {
    const r = Math.max(0, parseInt(hex.slice(1, 3), 16) - amount);
    const g = Math.max(0, parseInt(hex.slice(3, 5), 16) - amount);
    const b = Math.max(0, parseInt(hex.slice(5, 7), 16) - amount);
    return `rgb(${r}, ${g}, ${b})`;
  }
  colorAlpha(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
}

// ===== MAIN APP =====
function createApp() {
  const app = document.getElementById('app');
  let currentScreen = null;

  function showMenu() {
    if (currentScreen) currentScreen.remove();
    const menu = document.createElement('div');
    menu.style.cssText = `
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 24px; gap: 16px;
    `;
    const title = document.createElement('h1');
    title.textContent = 'ТОЧКИ';
    title.style.cssText = `
      font-size: 56px; font-weight: 800; letter-spacing: 8px;
      color: ${THEME.text}; margin: 0 0 32px 0;
      text-shadow: 0 0 30px ${THEME.accentGlow};
    `;
    const btnContainer = document.createElement('div');
    btnContainer.style.cssText = `
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 280px;
    `;
    const createBtn = (text, color, onClick) => {
      const btn = document.createElement('button');
      btn.textContent = text;
      btn.style.cssText = `
        padding: 14px 24px; font-size: 16px; font-weight: 600;
        background: #1e293b; color: ${THEME.text};
        border: 1px solid #334155; border-left: 3px solid ${color};
        border-radius: 12px; cursor: pointer; transition: all 0.25s ease;
        font-family: inherit;
      `;
      btn.addEventListener('click', onClick);
      btn.addEventListener('mouseenter', () => {
        btn.style.background = '#334155';
        btn.style.borderLeftWidth = '5px';
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.background = '#1e293b';
        btn.style.borderLeftWidth = '3px';
      });
      return btn;
    };
    btnContainer.appendChild(createBtn('Игра с ИИ', THEME.player1, () => startGame('pve', 'medium')));
    btnContainer.appendChild(createBtn('Два игрока', THEME.player2, () => startGame('pvp', null)));
    menu.appendChild(title);
    menu.appendChild(btnContainer);
    app.appendChild(menu);
    currentScreen = menu;
  }

  function startGame(mode, difficulty) {
    if (currentScreen) currentScreen.remove();
    const gameContainer = document.createElement('div');
    gameContainer.style.cssText = `
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; padding: 12px; gap: 0;
      font-family: inherit;
    `;
    const config = {
      boardWidth: 15,
      boardHeight: 15,
      player1Name: 'Игрок 1',
      player2Name: mode === 'pve' ? 'ИИ' : 'Игрок 2',
      player1Color: THEME.player1,
      player2Color: THEME.player2,
      gameMode: mode,
      aiDifficulty: difficulty,
      aiPlayer: 'blue',
    };
    const eventBus = new EventBus();
    const controller = new GameController(config, eventBus);
    const ai = mode === 'pve' ? new EasyAI() : null;
    controller.startGame();

    // Score bar
    const scoreBar = document.createElement('div');
    scoreBar.style.cssText = `
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; margin-bottom: 8px; gap: 12px;
      background: #1e293b; border-radius: 12px; border: 1px solid #334155;
      width: 100%; max-width: 500px;
    `;
    const p1Block = document.createElement('div');
    p1Block.style.cssText = `
      display: flex; flex-direction: column; align-items: flex-start;
      flex: 1; padding: 4px 8px;
    `;
    const p1Name = document.createElement('div');
    p1Name.textContent = config.player1Name;
    p1Name.style.cssText = `font-size: 13px; color: ${THEME.textSecondary}; margin-bottom: 2px;`;
    const p1Score = document.createElement('div');
    p1Score.textContent = '0';
    p1Score.style.cssText = `font-size: 28px; font-weight: 700; color: ${THEME.player1};`;
    p1Block.appendChild(p1Name);
    p1Block.appendChild(p1Score);
    const vs = document.createElement('span');
    vs.textContent = 'vs';
    vs.style.cssText = `color: ${THEME.textSecondary}; font-size: 14px;`;
    const p2Block = document.createElement('div');
    p2Block.style.cssText = `
      display: flex; flex-direction: column; align-items: flex-end;
      flex: 1; padding: 4px 8px;
    `;
    const p2Name = document.createElement('div');
    p2Name.textContent = config.player2Name;
    p2Name.style.cssText = `font-size: 13px; color: ${THEME.textSecondary}; margin-bottom: 2px;`;
    const p2Score = document.createElement('div');
    p2Score.textContent = '0';
    p2Score.style.cssText = `font-size: 28px; font-weight: 700; color: ${THEME.player2};`;
    p2Block.appendChild(p2Name);
    p2Block.appendChild(p2Score);
    scoreBar.appendChild(p1Block);
    scoreBar.appendChild(vs);
    scoreBar.appendChild(p2Block);

    // Canvas
    const canvas = document.createElement('canvas');
    canvas.style.cssText = `
      flex: 1; width: 100%; max-width: 500px; max-height: 70vh;
      border-radius: 12px; cursor: crosshair; touch-action: none;
    `;

    // Toolbar
    const toolbar = document.createElement('div');
    toolbar.style.cssText = `
      display: flex; justify-content: center; gap: 8px;
      padding: 8px 16px; margin-top: 8px;
      background: #1e293b; border-radius: 12px; border: 1px solid #334155;
      width: 100%; max-width: 500px;
    `;
    const createToolBtn = (icon, label, onClick) => {
      const btn = document.createElement('button');
      btn.style.cssText = `
        display: flex; flex-direction: column; align-items: center;
        gap: 2px; background: #263348; border: 1px solid #334155;
        border-radius: 8px; color: ${THEME.text};
        padding: 8px 16px; cursor: pointer; font-size: 20px;
        font-family: inherit; min-width: 56px; transition: all 0.2s;
      `;
      btn.innerHTML = `<span>${icon}</span><span style="font-size: 10px; color: ${THEME.textSecondary};">${label}</span>`;
      btn.addEventListener('click', onClick);
      return btn;
    };
    const undoBtn = createToolBtn('↩', 'Отменить', () => {
      controller.undo();
      updateUI();
    });
    const redoBtn = createToolBtn('↪', 'Повторить', () => {
      controller.redo();
      updateUI();
    });
    const passBtn = createToolBtn('⏭', 'Пас', () => {
      controller.pass();
      updateUI();
    });
    const menuBtn = createToolBtn('☰', 'Меню', showMenu);
    toolbar.appendChild(undoBtn);
    toolbar.appendChild(redoBtn);
    const spacer = document.createElement('div');
    spacer.style.flex = '1';
    toolbar.appendChild(spacer);
    toolbar.appendChild(passBtn);
    toolbar.appendChild(menuBtn);

    gameContainer.appendChild(scoreBar);
    gameContainer.appendChild(canvas);
    gameContainer.appendChild(toolbar);
    app.appendChild(gameContainer);

    const renderer = new BoardRenderer(canvas, config.boardWidth, config.boardHeight);

    function updateUI() {
      const score = controller.getScore();
      p1Score.textContent = String(score.red);
      p2Score.textContent = String(score.blue);
      const current = controller.getCurrentPlayer();
      p1Block.style.background = current === 'red' ? 'rgba(239, 68, 68, 0.1)' : 'transparent';
      p2Block.style.background = current === 'blue' ? 'rgba(59, 130, 246, 0.1)' : 'transparent';
      undoBtn.disabled = !controller.canUndo();
      undoBtn.style.opacity = controller.canUndo() ? '1' : '0.35';
      redoBtn.disabled = !controller.canRedo();
      redoBtn.style.opacity = controller.canRedo() ? '1' : '0.35';
      renderer.render(controller.getBoard(), { hoverPlayer: current });
    }

    updateUI();

    let lastMove = null;
    let hoverPoint = null;

    canvas.addEventListener('click', (e) => {
      if (controller.getPhase() !== 'playing') return;
      if (mode === 'pve' && controller.getCurrentPlayer() === 'blue') return;
      const rect = canvas.getBoundingClientRect();
      const p = renderer.canvasToGrid(e.clientX - rect.left, e.clientY - rect.top);
      if (p) {
        const result = controller.makeMove(p);
        if (result.success) {
          lastMove = p;
          hoverPoint = null;
          updateUI();
          renderer.render(controller.getBoard(), { lastMove, hoverPlayer: controller.getCurrentPlayer() });
          if (result.gameOver) {
            setTimeout(() => showGameOver(controller.getScore(), result.winner, config), 500);
          } else if (mode === 'pve' && ai) {
            setTimeout(() => doAiMove(), 400);
          }
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      hoverPoint = renderer.canvasToGrid(e.clientX - rect.left, e.clientY - rect.top);
      renderer.render(controller.getBoard(), { lastMove, hoverPoint, hoverPlayer: controller.getCurrentPlayer() });
    });

    canvas.addEventListener('mouseleave', () => {
      hoverPoint = null;
      renderer.render(controller.getBoard(), { lastMove, hoverPlayer: controller.getCurrentPlayer() });
    });

    window.addEventListener('resize', () => {
      renderer.resize();
      renderer.render(controller.getBoard(), { lastMove, hoverPoint, hoverPlayer: controller.getCurrentPlayer() });
    });

    function doAiMove() {
      if (controller.getPhase() !== 'playing' || !ai) return;
      const board = controller.getBoard();
      const player = controller.getCurrentPlayer();
      const move = ai.chooseMove(board, player);
      const result = controller.makeMove(move);
      if (result.success) {
        lastMove = move;
        updateUI();
        renderer.render(controller.getBoard(), { lastMove, hoverPlayer: controller.getCurrentPlayer() });
        if (result.gameOver) {
          setTimeout(() => showGameOver(controller.getScore(), result.winner, config), 500);
        }
      }
    }

    currentScreen = gameContainer;
  }

  function showGameOver(score, winner, config) {
    const overlay = document.createElement('div');
    overlay.style.cssText = `
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(15, 15, 35, 0.92); backdrop-filter: blur(8px);
      z-index: 100;
    `;
    const card = document.createElement('div');
    card.style.cssText = `
      background: #1e293b; border-radius: 16px; border: 1px solid #334155;
      padding: 32px; text-align: center; max-width: 340px; width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    `;
    const title = document.createElement('h2');
    if (winner) {
      const name = winner === 'red' ? config.player1Name : config.player2Name;
      title.textContent = `${name} победил!`;
      title.style.cssText = `color: ${winner === 'red' ? THEME.player1 : THEME.player2}; font-size: 26px;`;
    } else {
      title.textContent = 'Ничья!';
      title.style.cssText = `color: ${THEME.accent}; font-size: 26px;`;
    }
    title.style.margin = '0 0 24px 0';
    title.style.fontWeight = '700';

    const scoreRow = document.createElement('div');
    scoreRow.style.cssText = `display: flex; justify-content: center; gap: 32px; margin-bottom: 28px;`;
    const makeScoreBlock = (name, score, player) => {
      const block = document.createElement('div');
      const nameEl = document.createElement('div');
      nameEl.textContent = name;
      nameEl.style.cssText = `font-size: 13px; color: ${THEME.textSecondary}; margin-bottom: 4px;`;
      const scoreEl = document.createElement('div');
      scoreEl.textContent = String(score);
      scoreEl.style.cssText = `font-size: 42px; font-weight: 800; color: ${player === 'red' ? THEME.player1 : THEME.player2};`;
      block.appendChild(nameEl);
      block.appendChild(scoreEl);
      return block;
    };
    scoreRow.appendChild(makeScoreBlock(config.player1Name, score.red, 'red'));
    scoreRow.appendChild(makeScoreBlock(config.player2Name, score.blue, 'blue'));

    const btnContainer = document.createElement('div');
    btnContainer.style.cssText = `display: flex; flex-direction: column; gap: 10px;`;
    const playAgainBtn = document.createElement('button');
    playAgainBtn.textContent = 'Играть снова';
    playAgainBtn.style.cssText = `
      padding: 12px; font-size: 15px; font-weight: 600;
      background: ${THEME.accent}; color: #000; border: none;
      border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.2s;
    `;
    playAgainBtn.addEventListener('click', () => {
      overlay.remove();
      startGame(config.gameMode, config.aiDifficulty);
    });
    const menuBtn = document.createElement('button');
    menuBtn.textContent = 'Главное меню';
    menuBtn.style.cssText = `
      padding: 12px; font-size: 15px; font-weight: 500;
      background: #263348; color: ${THEME.text}; border: 1px solid #334155;
      border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.2s;
    `;
    menuBtn.addEventListener('click', () => {
      overlay.remove();
      showMenu();
    });
    btnContainer.appendChild(playAgainBtn);
    btnContainer.appendChild(menuBtn);

    card.appendChild(title);
    card.appendChild(scoreRow);
    card.appendChild(btnContainer);
    overlay.appendChild(card);
    document.body.appendChild(overlay);
  }

  showMenu();
}

createApp();
  </script>
</body>
</html>
